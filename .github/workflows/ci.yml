name: ci

on:
  pull_request:
  push:
    branches: [main, "roadmap/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.package }} / py${{ matrix.python }}${{ matrix.lowest && ' / lowest' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [llama-index-retrievers-lexapi, llama-index-tools-lexapi]
        python: ["3.11", "3.12", "3.13", "3.14"]
        lowest: [false]
        include:
          # The declared floors: lowest direct dependencies on the lowest Python.
          - package: llama-index-retrievers-lexapi
            python: "3.11"
            lowest: true
          - package: llama-index-tools-lexapi
            python: "3.11"
            lowest: true
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install uv==0.8.11
          python -m uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          if [ "${{ matrix.lowest }}" = "true" ]; then
            VIRTUAL_ENV=.venv python -m uv pip install --resolution lowest-direct -e . --group dev
          else
            VIRTUAL_ENV=.venv python -m uv pip install -e . --group dev
          fi
          VIRTUAL_ENV=.venv python -m uv pip list
      - name: Ruff
        run: |
          ruff check . ../testing ../scripts
          ruff format --check . ../testing ../scripts
      - name: Mypy (strict)
        run: mypy
      - name: Pytest (offline)
        run: pytest -q
      - name: Build and twine check
        run: |
          python -m build --installer uv
          twine check --strict dist/*
