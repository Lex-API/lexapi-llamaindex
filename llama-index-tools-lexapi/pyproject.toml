[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-lexapi"
version = "0.1.0"
description = "LlamaIndex tools for EU legislation from LexAPI: search, read, and the version for a date"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
authors = [{ name = "Arieta Labs Ltd", email = "support@lex-api.com" }]
maintainers = [{ name = "Arieta Labs Ltd", email = "support@lex-api.com" }]
keywords = ["llama-index", "lexapi", "eu-law", "eur-lex", "cjeu", "rag", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    # TODO(release): replace with "lexapi-client>=0.5.0,<0.6" once 0.5.0 is on PyPI.
    # PyPI refuses direct references, so this must change before any upload.
    "lexapi-client @ git+https://github.com/Lex-API/lexapi-python@4139bbd4f0939b4a4bf405bcde432bc835df4c95",
]

[project.urls]
Homepage = "https://lex-api.com"
Documentation = "https://lex-api.com/docs"
Repository = "https://github.com/Lex-API/lexapi-llamaindex"
Issues = "https://github.com/Lex-API/lexapi-llamaindex/issues"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-socket>=0.7,<1",
    "hypothesis>=6.100,<7",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "build>=1.2",
    "twine>=6.1",
]

[tool.hatch.metadata]
# Only for the pre-release git pin above.
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.lexapi"

[tool.llamahub.class_authors]
LexAPIToolSpec = "Lex-API"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["llama_index.tools.lexapi"]
known-third-party = ["lexapi_offline"]

[tool.mypy]
strict = true
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ".:../testing"
files = ["llama_index", "tests", "../testing/lexapi_offline.py"]

[[tool.mypy.overrides]]
# llama_index.core re-exports names without __all__ (e.g. get_dispatcher).
module = ["llama_index.core", "llama_index.core.*"]
implicit_reexport = true

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
